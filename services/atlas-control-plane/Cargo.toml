[package]
name = "atlas-control-plane"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Atlas Node registration, heartbeat, workload scheduling and contribution receipt control plane"

[dependencies]
axum = { version = "0.7", features = ["json", "macros"] }
hex = "0.4"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
